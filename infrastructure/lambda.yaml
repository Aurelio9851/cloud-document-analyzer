AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Cloud Document Analyzer - Lambda processing infrastructure.

Parameters:
  ProjectName:
    Type: String
    Default: cloud-document-analyzer

  S3BucketName:
    Type: String

  LambdaCodeS3Key:
    Type: String

Resources:
  # --------------------------------------------------
  # DOCUMENT PROCESSOR
  # --------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaDocumentProcessing
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/uploads/*"
              - Effect: Allow
                Action:
                  - textract:StartDocumentAnalysis
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt TextractNotificationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: textract.amazonaws.com
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-processor:*"

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-processor"
      RetentionInDays: 7

  DocumentProcessor:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-processor"
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref S3BucketName
          TEXTRACT_NOTIFICATION_TOPIC_ARN: !Ref TextractNotificationTopic
          TEXTRACT_NOTIFICATION_ROLE_ARN: !GetAtt TextractNotificationRole.Arn
      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: !Ref LambdaCodeS3Key

  AllowS3InvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DocumentProcessor
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}"
      SourceAccount: !Ref AWS::AccountId

  # --------------------------------------------------
  # TEXTRACT NOTIFICATIONS: SNS
  # --------------------------------------------------
  TextractNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-textract-notifications"

  TextractNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref TextractNotificationTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowTextractPublish
            Effect: Allow
            Principal:
              Service: textract.amazonaws.com
            Action:
              - sns:Publish
            Resource: !Ref TextractNotificationTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  TextractNotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-textract-notification-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: textract.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PublishTextractNotification
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref TextractNotificationTopic

  # --------------------------------------------------
  # TEXTRACT NOTIFICATIONS: SQS AND DLQ
  # --------------------------------------------------
  TextractDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-textract-dlq"
      MessageRetentionPeriod: 1209600

  TextractResultsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-textract-results"
      VisibilityTimeout: 720
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TextractDeadLetterQueue.Arn
        maxReceiveCount: 3

  TextractQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref TextractResultsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt TextractResultsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref TextractNotificationTopic

  TextractQueueSubscription:
    Type: AWS::SNS::Subscription
    DependsOn:
      - TextractQueuePolicy
    Properties:
      TopicArn: !Ref TextractNotificationTopic
      Protocol: sqs
      Endpoint: !GetAtt TextractResultsQueue.Arn
      RawMessageDelivery: false

  # --------------------------------------------------
  # UPLOAD URL GENERATOR
  # --------------------------------------------------
  UploadUrlExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-upload-url-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GeneratePresignedUploadUrl
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/uploads/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-upload-url:*"

  UploadUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-upload-url"
      RetentionInDays: 7

  UploadUrlGenerator:
    Type: AWS::Lambda::Function
    DependsOn:
      - UploadUrlLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-upload-url"
      Runtime: python3.11
      Handler: upload_url_handler.lambda_handler
      Role: !GetAtt UploadUrlExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          BUCKET_NAME: !Ref S3BucketName
      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: !Ref LambdaCodeS3Key

  # --------------------------------------------------
  # API GATEWAY
  # --------------------------------------------------
  UploadHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-http-api"
      ProtocolType: HTTP
      Description: HTTP API for generating document upload URLs

  UploadUrlIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref UploadHttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt UploadUrlGenerator.Arn
      PayloadFormatVersion: "2.0"

  UploadUrlRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UploadHttpApi
      RouteKey: "POST /upload-url"
      Target: !Sub "integrations/${UploadUrlIntegration}"

  UploadUrlStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref UploadHttpApi
      StageName: "$default"
      AutoDeploy: true

  UploadUrlApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt UploadUrlGenerator.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub
        - "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/upload-url"
        - ApiId: !Ref UploadHttpApi

  # --------------------------------------------------
  # RESULTS PROCESSOR
  # --------------------------------------------------
  ResultsProcessorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-results-processor-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProcessTextractResults
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource:
                  - !GetAtt TextractResultsQueue.Arn
              - Effect: Allow
                Action:
                  - textract:GetDocumentAnalysis
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/processed/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-results-processor:*"

  ResultsProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-results-processor"
      RetentionInDays: 7

  ResultsProcessor:
    Type: AWS::Lambda::Function
    DependsOn:
      - ResultsProcessorLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-results-processor"
      Runtime: python3.11
      Handler: results_handler.lambda_handler
      Role: !GetAtt ResultsProcessorExecutionRole.Arn
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          BUCKET_NAME: !Ref S3BucketName
      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: !Ref LambdaCodeS3Key

  ResultsQueueEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt TextractResultsQueue.Arn
      FunctionName: !GetAtt ResultsProcessor.Arn
      Enabled: true
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures

Outputs:
  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref DocumentProcessor

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt DocumentProcessor.Arn

  LambdaExecutionRoleArn:
    Description: Lambda execution role ARN
    Value: !GetAtt LambdaExecutionRole.Arn

  UploadUrlFunctionName:
    Description: Upload URL generator Lambda function name
    Value: !Ref UploadUrlGenerator

  UploadUrlFunctionArn:
    Description: Upload URL generator Lambda ARN
    Value: !GetAtt UploadUrlGenerator.Arn

  UploadApiId:
    Description: API Gateway HTTP API ID
    Value: !Ref UploadHttpApi

  UploadApiEndpoint:
    Description: Public HTTP API endpoint
    Value: !Sub "https://${UploadHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  UploadApiRoute:
    Description: Upload URL generation endpoint
    Value: !Sub "https://${UploadHttpApi}.execute-api.${AWS::Region}.amazonaws.com/upload-url"

  TextractNotificationTopicArn:
    Description: SNS topic for Textract completion notifications
    Value: !Ref TextractNotificationTopic

  TextractNotificationRoleArn:
    Description: IAM role assumed by Textract
    Value: !GetAtt TextractNotificationRole.Arn

  TextractResultsQueueArn:
    Description: SQS queue for Textract results
    Value: !GetAtt TextractResultsQueue.Arn

  TextractResultsQueueUrl:
    Description: SQS queue URL
    Value: !Ref TextractResultsQueue

  TextractDeadLetterQueueArn:
    Description: Textract dead-letter queue ARN
    Value: !GetAtt TextractDeadLetterQueue.Arn

  ResultsProcessorFunctionArn:
    Description: Results processor Lambda ARN
    Value: !GetAtt ResultsProcessor.Arn
