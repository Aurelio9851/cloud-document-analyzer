
AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Cloud Document Analyzer - Lambda processing infrastructure.

Parameters:
  ProjectName:
    Type: String
    Default: cloud-document-analyzer

  S3BucketName:
    Type: String

  LambdaCodeS3Key:
    Type: String

Resources:

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: LambdaS3ReadAndLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/uploads/*"

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-processor:*"

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-processor"
      RetentionInDays: 7

  DocumentProcessor:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-processor"
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256

      Environment:
        Variables:
          BUCKET_NAME: !Ref S3BucketName

      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: !Ref LambdaCodeS3Key

  AllowS3InvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DocumentProcessor
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}"
      SourceAccount: !Ref AWS::AccountId
  

  UploadUrlExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-upload-url-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: GeneratePresignedUploadUrl
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/uploads/*"

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-upload-url:*"

  UploadUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-upload-url"
      RetentionInDays: 7

  UploadUrlGenerator:
    Type: AWS::Lambda::Function
    DependsOn:
      - UploadUrlLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-upload-url"
      Runtime: python3.11
      Handler: upload_url_handler.lambda_handler
      Role: !GetAtt UploadUrlExecutionRole.Arn
      Timeout: 10
      MemorySize: 128

      Environment:
        Variables:
          BUCKET_NAME: !Ref S3BucketName

      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: !Ref LambdaCodeS3Key

  
  UploadHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-http-api"
      ProtocolType: HTTP
      Description: HTTP API for generating document upload URLs

  UploadUrlIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref UploadHttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt UploadUrlGenerator.Arn
      PayloadFormatVersion: "2.0"

  UploadUrlRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UploadHttpApi
      RouteKey: "POST /upload-url"
      Target: !Sub "integrations/${UploadUrlIntegration}"

  UploadUrlStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref UploadHttpApi
      StageName: "$default"
      AutoDeploy: true

  UploadUrlApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt UploadUrlGenerator.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub
        - "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/upload-url"
        - ApiId: !Ref UploadHttpApi

Outputs:
  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref DocumentProcessor

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt DocumentProcessor.Arn

  LambdaExecutionRoleArn:
    Description: Lambda execution role ARN
    Value: !GetAtt LambdaExecutionRole.Arn
  
  UploadUrlFunctionName:
    Description: Upload URL generator Lambda function name
    Value: !Ref UploadUrlGenerator

  UploadUrlFunctionArn:
    Description: Upload URL generator Lambda function ARN
    Value: !GetAtt UploadUrlGenerator.Arn
  
  UploadApiId:
    Description: API Gateway HTTP API ID
    Value: !Ref UploadHttpApi

  UploadApiEndpoint:
    Description: Public HTTP API endpoint
    Value: !Sub "https://${UploadHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  UploadApiRoute:
    Description: Upload URL generation endpoint
    Value: !Sub "https://${UploadHttpApi}.execute-api.${AWS::Region}.amazonaws.com/upload-url"

