
AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Cloud Document Analyzer - Lambda infrastructure.

Parameters:
  ProjectName:
    Type: String
    Default: cloud-document-analyzer

  S3BucketName:
    Type: String
    Default: cloud-document-analyzer-1793537371

Resources:

  # IAM role assumed by Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: LambdaS3ReadAndLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              # Read documents from S3
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/uploads/*"

              # Write logs to CloudWatch
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-processor:*"

  # CloudWatch log group
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-processor"
      RetentionInDays: 7

  # Lambda function
  DocumentProcessor:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-processor"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256

      Environment:
        Variables:
          BUCKET_NAME: !Ref S3BucketName

      Code:
        ZipFile: |
          import json
          import os
          import boto3

          s3 = boto3.client("s3")

          def lambda_handler(event, context):

              print("Received event:")
              print(json.dumps(event))

              bucket = event.get("bucket", os.environ["BUCKET_NAME"])
              object_key = event["object_key"]

              print(f"Reading document: s3://{bucket}/{object_key}")

              response = s3.get_object(
                  Bucket=bucket,
                  Key=object_key
              )

              content = response["Body"].read().decode("utf-8")

              result = {
                  "bucket": bucket,
                  "object_key": object_key,
                  "content_length": len(content),
                  "preview": content[:200]
              }

              print("Document processed:")
              print(json.dumps(result))

              return {
                  "statusCode": 200,
                  "body": json.dumps(result)
              }

Outputs:
  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref DocumentProcessor

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt DocumentProcessor.Arn

  LambdaExecutionRoleArn:
    Description: Lambda execution role ARN
    Value: !GetAtt LambdaExecutionRole.Arn
